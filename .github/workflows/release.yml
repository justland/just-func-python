name: release
on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  code:
    uses: ./.github/workflows/python-verify.yml

  release:
    needs: code
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: '3.13'
          # The release job only builds when a publish is due, so there is nothing
          # to cache and setup-uv's post step errors on the missing cache path.
          enable-cache: false

      - name: Resolve version
        id: version
        run: |
          version=$(uv version --short)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if curl -sfL "https://pypi.org/pypi/just-func/$version/json" >/dev/null; then
            echo "just-func $version is already on PyPI; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "just-func $version is not on PyPI; publishing."
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        if: steps.version.outputs.publish == 'true'
        run: uv build

      - name: Publish to PyPI
        if: steps.version.outputs.publish == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Tag release
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/git/refs" \
            -f ref="refs/tags/v${{ steps.version.outputs.version }}" \
            -f sha="${{ github.sha }}"
